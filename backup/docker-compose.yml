services:
  backup:
    build: .
    command: crond -f
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./scripts:/scripts
      - ../terraform:/data/terraform
      - ./crontab:/etc/crontabs/root
    extra_hosts:
      - "ministack:host-gateway"
