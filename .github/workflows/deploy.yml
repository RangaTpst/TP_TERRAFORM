name: Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nextjs

      - name: Build
        run: npm run build
        working-directory: nextjs

  test-s3:
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack
        ports:
          - 4566:4566
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nextjs

      - name: Create .env.local
        run: cp ../.env.example .env.local
        working-directory: nextjs

      - name: Create S3 buckets
        run: |
          aws --endpoint-url=http://localhost:4566 s3 mb s3://bucket-hot
          aws --endpoint-url=http://localhost:4566 s3 mb s3://bucket-cold
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Build
        run: npm run build
        working-directory: nextjs

  validate-monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config
        working-directory: monitoring

  deploy:
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nextjs

      - name: Build
        run: npm run build
        working-directory: nextjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: nextjs/.next

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform
